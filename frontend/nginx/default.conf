server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 70s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health { proxy_pass http://api:8000/health; }
    location = /ready { proxy_pass http://api:8000/ready; }
    location = /model/status { proxy_pass http://api:8000/model/status; }
    location = /version.json { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

