# Standalone deployment file, not an override: use -f compose.jetstream.yml every time.
name: returnflow
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: returnflow
      POSTGRES_USER: returnflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnflow -d returnflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:?Use a tested API image digest from the release manifest}
    environment:
      ENVIRONMENT: jetstream-demo
      DATABASE_URL: postgresql+psycopg://returnflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/returnflow
      WORKFLOW_MODE: apparel
      EXTRACTION_MODE: ${EXTRACTION_MODE:-guided}
      COLLECTION_STYLE: ${COLLECTION_STYLE:-checklist}
      DEMO_ENABLED: "true"
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?Generate a private demo session secret}
      DEMO_COOKIE_SECURE: ${DEMO_COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      # Empty unless the private .env sets it. The API reads this; the frontend never does.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_RESPONSE_FORMAT: ${DASHSCOPE_RESPONSE_FORMAT:-auto}
      POLICY_RETRIEVER: lexical
      POLICY_GENERATOR: extractive
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    image: ${FRONTEND_IMAGE:?Use the matching tested frontend image digest}
    ports:
      # Loopback by default. Explicitly opt in for a synthetic public course demo.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  ollama:
    # Guided deployments never start this profile. LLM deploys require a digest below.
    image: ${OLLAMA_IMAGE:-ollama/ollama:configure-before-model-use}
    profiles: ["model"]
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - models:/root/.ollama
    restart: unless-stopped
    mem_limit: 12g
    cpus: 6
    # No host ports and no GPU devices. API uses private service DNS 'ollama'.

volumes:
  db:
    name: returnflow_returnflow-db
  models:
    name: returnflow-ollama
