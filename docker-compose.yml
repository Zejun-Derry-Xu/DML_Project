services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: returnflow
      POSTGRES_USER: returnflow
      POSTGRES_PASSWORD: returnflow
    ports:
      - "5432:5432"
    volumes:
      - returnflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnflow -d returnflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://returnflow:returnflow@db:5432/returnflow
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      POLICY_RETRIEVER: ${POLICY_RETRIEVER:-lexical}
      POLICY_GENERATOR: ${POLICY_GENERATOR:-extractive}
      POLICY_QDRANT_URL: http://qdrant:6333
      POLICY_QDRANT_COLLECTION: ${POLICY_QDRANT_COLLECTION:-returnflow_policy_mvp_1}
      POLICY_QDRANT_API_KEY: ${POLICY_QDRANT_API_KEY:-}
      POLICY_OLLAMA_URL: http://host.docker.internal:11434
      POLICY_EMBEDDING_MODEL: ${POLICY_EMBEDDING_MODEL:-embeddinggemma}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: ["rag"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - returnflow-qdrant:/qdrant/storage

volumes:
  returnflow-db:
  returnflow-qdrant:
